version: '3.8'

services:
  wan2gp-gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: deepbeepmeep/wan2gp-gateway:latest
    container_name: wan2gp-gateway
    restart: unless-stopped
    ports:
      - "50080:50080"
    environment:
      - START_GATEWAY=1
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-my_super_secret_cookcalai_token_999}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../models:/workspace/models
      - ../defaults:/workspace/defaults
      - ../finetunes:/workspace/finetunes
      - ../outputs:/workspace/outputs
      - ../loras:/workspace/loras
      - ./gateway_config.json:/workspace/gateway/gateway_config.json
