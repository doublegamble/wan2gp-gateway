services:
  wan2gp-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wan2gp-gateway
    restart: unless-stopped
    ports:
      - "50080:50080"
    environment:
      - START_GATEWAY=1
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-my_super_secret_cookcalai_token_999}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ..:/workspace
