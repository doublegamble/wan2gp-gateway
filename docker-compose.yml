services:
  wan2gp-gateway:
    build:
      context: ..
      dockerfile: wan2gp-gateway/Dockerfile
    container_name: wan2gp-gateway
    restart: unless-stopped
    entrypoint: ["bash", "-c", "tr -d '\\r' < /workspace/entrypoint.sh > /tmp/ep.sh && chmod +x /tmp/ep.sh && sed -i 's/python3 wgp.py --listen/python3 wan2gp-gateway\\/gateway.py/' /tmp/ep.sh && bash /tmp/ep.sh"]
    ports:
      - "58080:50080"
    environment:
      - START_GATEWAY=1
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-my_super_secret_cookcalai_token_999}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ..:/workspace
